name: campus-market

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先复制 .env.example 为 .env 并填写}
      MYSQL_DATABASE: campus_market
      MYSQL_USER: campus
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先在 .env 中设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动（数据卷为空）时执行基础建表与初始化数据；
      # 此后所有结构变更改为在 campus-market/src/main/resources/db/migration 新增 V27+ 脚本，由 Flyway 启动时自动升级
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - campus
    # 需要本机连数据库调试时再打开，默认不对外暴露
    # ports:
    #   - "3307:3306"

  backend:
    build: ./campus-market
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 数据库：compose 内直接走 mysql 容器，绕过 localhost 硬编码
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/campus_market?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_USERNAME: campus
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # JWT 签名密钥：.env 里必须显式配置（32 字节以上），prod profile 启动时 ProductionSecurityCheck 会校验默认值
      JWT_SECRET: ${JWT_SECRET:?请先在 .env 中设置 JWT_SECRET（至少 32 字节）}
      # 跨域：prod 下必须覆盖 application.yml 默认值，包含 Nginx 反代入口 http://localhost:8080
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080"
      # 上传目录：容器内路径，宿主机由命名卷持久化
      UPLOAD_PATH: /data/upload/
      # 日志写文件并按天滚动（logback-spring.xml），命名卷持久化 14 天 / 500MB 上限
      LOG_PATH: /app/logs
      # prod 默认关闭慢 SQL WARN 刷屏；需要排查时显式注入 SLOW_SQL_ENABLED=true
      SLOW_SQL_ENABLED: "false"
      TZ: Asia/Shanghai
    volumes:
      - upload-data:/data/upload
      - app-logs:/app/logs
    expose:
      - "8081"
    # 探活 actuator：包含数据源连通性，DB 不可用时容器会被标记为 unhealthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - campus

  web:
    build: ./campus-market-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTPS 证书目录（启用 443 时取消注释）
      # - ./deploy/nginx/certs:/etc/nginx/certs:ro
    # Nginx 探活：取首页，避免后端未就绪时把 web 也判成不健康
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - campus

volumes:
  mysql-data:
  upload-data:
  app-logs:

networks:
  campus:
    driver: bridge
