server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 文本类资源全部压缩传输：JS/CSS 体积可降到原来的 1/5 左右，首屏明显更快
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    # 与后端 multipart 上限（25MB）保持一致，图片单张限 5MB 由后端校验
    client_max_body_size 25m;

    # SSE 实时消息通道：必须关闭代理缓冲，否则事件会被攒在 Nginx 里延迟下发
    location = /api/message/stream {
        proxy_pass http://backend:8081/message/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 接口统一走 /api，转发到容器内后端并去掉前缀
    location /api/ {
        proxy_pass http://backend:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # 上传的图片与附件由后端静态映射提供，直接反代，避免被 SPA 回退成 index.html
    location /upload/ {
        proxy_pass http://backend:8081/upload/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800";
    }

    # 缩略图由后端按需生成并缓存
    location /thumb/ {
        proxy_pass http://backend:8081/thumb/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800";
    }

    # 带 hash 的静态资源可以长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 单页应用路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
