server:
  port: 8081
  # 反向代理（Nginx）转发时，让 Tomcat 正确处理 X-Forwarded-* 头，
  # 使 request.getScheme()/getServerName()/getServerPort() 返回客户端真实值，
  # 避免 Spring CORS 同源判断把代理后的请求误判为跨域。
  forward-headers-strategy: native

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus_market?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    # 数据库密码通过环境变量 DB_PASSWORD 注入，本地未设置时使用默认值（生产环境务必覆盖）
    password: ${DB_PASSWORD:luolei_2005}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  # 数据库版本化迁移：基础建表仍由 deploy/mysql/init 在数据卷首次启动时完成，
  # Flyway 只负责此后的增量变更（db/migration 下的 V27 起脚本）
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 已有数据库首次接入时以 V26 为基线（对应 26 个历史初始化脚本），只执行 V27+
    baseline-on-migrate: true
    baseline-version: 26
    baseline-description: 既有数据库基线
    # 迁移脚本一旦发布不再修改，校验失败直接启动失败，避免结构漂移
    validate-on-migrate: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    # 关闭 SQL 全量打印，避免参数（含密码哈希等）泄露到日志；开发调试可临时改回 StdOutImpl
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 上传目录：容器部署由 docker-compose 的 UPLOAD_PATH=/data/upload/ 覆盖，
# 本地开发不设置时回退到 Windows 路径
upload:
  path: ${UPLOAD_PATH:C:/campus-market/upload/}

# JWT 配置（无状态鉴权）
jwt:
  # HS256 要求密钥长度 >= 32 字节；通过环境变量 JWT_SECRET 注入，生产环境务必覆盖默认值
  secret: ${JWT_SECRET:campus-market-jwt-secret-key-2024-please-change-in-production-env}
  # 有效期 24 小时（毫秒）
  expiration: 86400000

# 跨域白名单（逗号分隔）；生产由 Nginx 同源代理，一般无需放开
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  # 慢 SQL 采样：Executor 层统计真实执行耗时，超过阈值的语句打 WARN（见 SlowSqlInterceptor）
  slow-sql:
    enabled: ${SLOW_SQL_ENABLED:true}
    threshold-ms: ${SLOW_SQL_THRESHOLD_MS:500}

# 运行指标：只暴露健康检查端点，供 docker healthcheck 与运维探活使用
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never

# SpringDoc OpenAPI（Swagger UI）
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  packages-to-scan: com.example.campusmarket.controller

# 日志：按天滚动写文件（见 logback-spring.xml），保留 14 天、总量上限 500MB；
# 超过 500ms 的 SQL 由 SlowSqlInterceptor 打 WARN
logging:
  level:
    com.example.campusmarket: INFO
    org.springframework.security: INFO
  file:
    path: ${LOG_PATH:logs}
