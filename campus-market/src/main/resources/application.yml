# ============ 通用基础配置（所有 profile 共享） ============

server:
  port: 8081
  # 反向代理（Nginx）转发时，让 Tomcat 正确处理 X-Forwarded-* 头，
  # 避免 Spring CORS 同源判断把代理后的请求误判为跨域
  forward-headers-strategy: native

spring:
  # 统一编码与时区，跨环境一致
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  # Flyway 只负责既有库的增量迁移（V27+）；
  # 空数据卷首次启动的基础建表仍由 deploy/mysql/init 完成，避免 replay 历史 26 个脚本
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 26
    baseline-description: 既有数据库基线
    validate-on-migrate: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    # 关闭 SQL 全量打印，避免参数（含密码哈希等）泄露到日志
    # 开发调试可临时改回 StdOutImpl（dev profile 覆盖）
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# JWT 配置（无状态鉴权）
jwt:
  secret: ${JWT_SECRET:campus-market-jwt-secret-key-2024-please-change-in-production-env}
  expiration: 86400000

# 跨域白名单（逗号分隔）；默认值只覆盖前端开发端口，生产通过 CORS_ALLOWED_ORIGINS 注入
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  # 慢 SQL 采样：Executor 层统计真实执行耗时，超过阈值的语句打 WARN
  slow-sql:
    enabled: ${SLOW_SQL_ENABLED:true}
    threshold-ms: ${SLOW_SQL_THRESHOLD_MS:500}

# 上传目录：容器部署由 docker-compose 的 UPLOAD_PATH=/data/upload/ 覆盖
upload:
  path: ${UPLOAD_PATH:C:/campus-market/upload/}

# 运行指标：只暴露健康检查端点，供 docker healthcheck 与运维探活使用
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never

# SpringDoc OpenAPI：默认开启，dev 调试用；prod 覆盖关闭
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  packages-to-scan: com.example.campusmarket.controller

# 日志：按天滚动写文件，保留 14 天、总量上限 500MB；慢 SQL 由 SlowSqlInterceptor 打 WARN
logging:
  level:
    com.example.campusmarket: INFO
    org.springframework.security: INFO
  file:
    path: ${LOG_PATH:logs}
